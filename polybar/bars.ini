[bar/barbase]
width = 100%
monitor = ${env:monitor}
offset-x = 0
workspace = ${env:workspace}
offset-y = 0
height = 20
fixed-center = true
bottom = false

background = ${color.bg}
foreground = ${color.fg}

radius-top = 0.0
radius-bottom = 0.0

padding = 2
module-margin-left = 2
module-margin-right = 2

font-0 = "FiraCode Nerd Font:size=10:weight=semibold;3"
font-1 = "Symbols Nerd Font:size=10;3"
font-2 = "Font Awesome 6 Free:size=10;3"
modules-center = date
modules-right = xidlehook cpu memory tray

enable-ipc = true

[bar/mainbar0]
inherit = bar/barbase
;;modules-left = activity workspace0
modules-left = workspace0

[module/workspace0]
type = custom/script
exec = leftwm-state -w 0 -t "$SCRIPTPATH/template.liquid"
tail = true

[bar/mainbar1]
inherit = bar/barbase
;;modules-left = activity workspace1
modules-left = workspace1

[module/workspace1]
type = custom/script
exec = leftwm-state -w 1 -t "$SCRIPTPATH/template.liquid"
tail = true
